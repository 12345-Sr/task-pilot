services:
  - type: web
    name: task-pilot-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@taskpilot.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: task-pilot-db
          property: connectionString
      - key: DB_REGION
        value: oregon
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SUBSCRIPTION_PRICE_PAISE
        value: "39900"
      - key: FREE_DAILY_LIMIT
        value: "3"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Task Pilot <no-reply@taskpilot.com>"

databases:
  - name: task-pilot-db
    databaseName: taskpilot
    user: taskpilot_user
    region: oregon
    plan: free
